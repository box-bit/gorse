# Lab #7 - minimal single-node configuration for the GitHub-hosted runner.
# SQLite data/cache stores (no external services), one non-personalized leaderboard,
# collaborative filtering / ranking disabled, and a 10s task loop so that the master
# recomputes the leaderboard shortly after the test data is inserted.
[database]
cache_store = "sqlite://./cache.db"
data_store = "sqlite://./data.db"

[master]
port = 8086
host = "127.0.0.1"
http_port = 8088
http_host = "127.0.0.1"
n_jobs = 1

[server]
default_n = 10

[recommend]
cache_size = 100

[recommend.data_source]
positive_feedback_types = ["star"]
read_feedback_types = ["read"]

[[recommend.non-personalized]]
name = "most_starred"
score = "count(feedback, .FeedbackType == 'star')"

[recommend.collaborative]
type = "none"
fit_period = "10s"

[recommend.ranker]
type = "none"
fit_period = "10s"
